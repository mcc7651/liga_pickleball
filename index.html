<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="document.addEventListener('DOMContentLoaded',()=>{const e=document.querySelector('#connection');if(e)e.textContent='No se pudo cargar la conexión. Abre la liga desde su dirección publicada en GitHub Pages y comprueba tu conexión a internet.'})"></script>
<style>
:root{--green:#047857;--dark:#064e3b;--mint:#ecfdf5;--line:#dbe4e2;--ink:#172b26;--muted:#5b6b66;--rose:#fff1f2;--amber:#fffbeb}*{box-sizing:border-box}body{margin:0;background:#f5f8f7;color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(110deg,#059669,#0f766e);color:white;padding:22px max(18px,calc((100vw - 1200px)/2));}header h1{margin:0;font-size:clamp(23px,4vw,34px)}header p{margin:5px 0 0;color:#d1fae5}.wrap{max-width:1200px;margin:auto;padding:18px}.bar,.card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #15382c0a}.bar{padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.bar button,.btn{border:0;border-radius:9px;background:#eef4f1;color:var(--ink);padding:10px 14px;font-weight:650;cursor:pointer}.bar button.active,.btn.primary{background:var(--green);color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.card{padding:18px;margin-bottom:16px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.stat{background:#f8fbf9;border:1px solid var(--line);border-radius:12px;padding:14px}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#edf4f1;font-size:12px}.pill.ok{background:#dcfce7;color:#166534}.pill.wait{background:#fef3c7;color:#92400e}.pill.bad{background:#ffe4e6;color:#9f1239}input,select,textarea{width:100%;border:1px solid #cbd5d1;border-radius:8px;padding:10px;font:inherit;background:white}label{display:block;font-size:13px;font-weight:650;margin:7px 0 4px}form{max-width:640px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:9px 7px;text-align:left}th{background:#f2f6f4;font-size:11px;text-transform:uppercase;color:#52635d;white-space:nowrap}.scroll{overflow:auto}.matrix-scroll{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch}.matrix{table-layout:fixed;min-width:850px}.matrix th,.matrix td{text-align:center;padding:3px;font-size:10px}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#eef4f1;z-index:1;width:86px;text-align:left}.matrix th:not(:first-child){width:47px}.matrix td button{border:1px solid #d6e3dd;border-radius:4px;width:100%;min-height:34px;background:#fff;font-size:10px;overflow-wrap:anywhere;color:#374c43}.matrix td button.win{background:#dcfce7;color:#14532d}.matrix td button.loss{background:#ffe4e6;color:#9f1239}.matrix td button.pending{background:#fffbeb;color:#854d0e}.matrix td button:disabled{cursor:default}.notice{padding:11px 13px;border-radius:9px;background:#eff6ff;color:#1e3a8a;font-size:13px}.notice.warn{background:var(--amber);color:#92400e}.notice.error{background:var(--rose);color:#9f1239}.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions .btn{padding:7px 10px;font-size:12px}.right{text-align:right}.toast{position:fixed;bottom:18px;right:18px;background:#163b2e;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 6px 30px #0002;z-index:9}.modal{position:fixed;inset:0;background:#10251dcc;display:grid;place-items:center;padding:16px;z-index:10}.modal>div{background:white;border-radius:15px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}.foot{color:#77857f;font-size:12px;text-align:center;padding:16px}@media(max-width:600px){.wrap{padding:12px}.card{padding:14px}.bar button{flex:1 1 42%}.matrix{min-width:850px}}
</style></head>
<body>
<header><h1>🏓 Liga Amateur de Pickleball</h1><p id="subtitle">Clasificación, calendario y resultados compartidos</p></header>
<main class="wrap">
<div id="connection" class="notice warn">Conectando con la base de datos…</div>
<div class="bar" id="nav"></div>
<section id="content"></section>
<div class="foot">Liga Amateur de Pickleball · Los teléfonos de los capitanes solo son visibles para la directiva.</div>
</main><div id="toast" class="toast hidden"></div><div id="modal"></div>
<script>
const SUPABASE_URL='https://jfjevdkiinqhpsqkzter.supabase.co';
const SUPABASE_KEY='sb_publishable_dFlLBsrnDRRreoItpYsK7Q_2TrINEGg';
const db=window.supabase?.createClient?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let savedCaptainSession=null;try{savedCaptainSession=JSON.parse(sessionStorage.getItem('leagueCaptainSession')||'null')}catch{}
const state={tab:'standings',teams:[],contacts:{},matches:[],settings:{president:'Por determinar',secretary:'Por determinar',dinner_cost:600,menu_price:30},adminSettings:{whatsapp_group_invite_url:''},session:null,isAdmin:false,captainSession:savedCaptainSession,captainTeamId:null,loginMode:'admin',busy:false};
const tabs=[['standings','Clasificación'],['matrix','Cuadro'],['schedule','Calendario'],['register','Inscribir equipo'],['teams','Equipos y directiva'],['rules','Normas y cena']];
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500)}
function setBusy(v){state.busy=v;render()}
function err(e){console.error(e);toast(e?.message||'No se pudo completar la acción')}
function mapTeam(t){return {...t,id:t.id,approved:t.status==='approved'};}
function mapMatch(m){let hs=m.home_sets||[],as=m.away_sets||[];const played=m.status==='confirmed';let hw=0,aw=0;hs.forEach((x,i)=>{if(x>as[i])hw++;else if(x<as[i])aw++});let hp=hw===2?(aw===0?3:2):(hw===1?1:0),ap=aw===2?(hw===0?3:2):(aw===1?1:0);return {...m,round:m.round_number,week:m.week_label,memo:m.memo||'',homeId:m.home_team_id,awayId:m.away_team_id,homeSet1:hs[0]??null,awaySet1:as[0]??null,homeSet2:hs[1]??null,awaySet2:as[1]??null,homeSet3:hs[2]??null,awaySet3:as[2]??null,played,winnerId:played?(hw===2?m.home_team_id:m.away_team_id):null,homePoints:played?hp:0,awayPoints:played?ap:0};}
let connectionWatchdog;async function load(){clearTimeout(connectionWatchdog);connectionWatchdog=setTimeout(()=>{const banner=document.querySelector('#connection');if(banner&&!banner.classList.contains('hidden')){banner.className='notice error';banner.textContent='Supabase no ha respondido en 15 segundos. Comprueba la conexión a internet y que el proyecto siga activo; recarga la página para intentarlo de nuevo.'}},15000);try{const [{data:teams,error:te},{data:matches,error:me},{data:settings}]=await Promise.all([db.from('teams').select('*').order('created_at'),db.from('matches').select('*').order('round_number'),db.from('league_settings').select('*').maybeSingle()]);if(te)throw te;if(me)throw me;state.teams=(teams||[]).map(mapTeam);state.matches=(matches||[]).map(mapMatch);if(settings)state.settings=settings;if(state.isAdmin){const [{data:contacts},{data:privateSettings}]=await Promise.all([db.from('team_contacts').select('team_id,captain_name,captain_phone'),db.from('admin_settings').select('*').maybeSingle()]);state.contacts=Object.fromEntries((contacts||[]).map(x=>[x.team_id,x]));if(privateSettings)state.adminSettings=privateSettings;}if(state.captainSession&&!state.isAdmin){const {data,error}=await db.rpc('captain_team_for_access',{p_phone:state.captainSession.phone,p_access_code:state.captainSession.code});state.captainTeamId=error?null:data;if(!state.captainTeamId){state.captainSession=null;sessionStorage.removeItem('leagueCaptainSession');}}clearTimeout(connectionWatchdog);document.querySelector('#connection').classList.add('hidden');}catch(e){clearTimeout(connectionWatchdog);document.querySelector('#connection').className='notice error';document.querySelector('#connection').textContent='No se pudo leer Supabase: '+(e.message||'Comprueba que ejecutaste el SQL de configuración.');console.error(e);}render();}
if(db)db.auth.onAuthStateChange((_event,session)=>{state.session=session;state.isAdmin=false;if(session){state.captainSession=null;state.captainTeamId=null;sessionStorage.removeItem('leagueCaptainSession');}setTimeout(async()=>{if(session){const {data,error}=await db.rpc('is_league_admin');state.isAdmin=!error&&data===true;}await load();},0);});
function standings(){const s=Object.fromEntries(state.teams.filter(t=>t.approved).map(t=>[t.id,{id:t.id,name:t.name,points:0,played:0,won:0,lost:0,setsWon:0,setsLost:0,pointsWon:0,pointsLost:0}]));for(const m of state.matches){if(!m.played||!s[m.homeId]||!s[m.awayId])continue;const h=s[m.homeId],a=s[m.awayId];h.played++;a.played++;h.points+=m.homePoints;a.points+=m.awayPoints;if(m.winnerId===m.homeId){h.won++;a.lost++}else{a.won++;h.lost++}const hs=[m.homeSet1,m.homeSet2,m.homeSet3],as=[m.awaySet1,m.awaySet2,m.awaySet3];hs.forEach((x,i)=>{if(x==null||as[i]==null)return;if(x>as[i]){h.setsWon++;a.setsLost++}else{a.setsWon++;h.setsLost++}h.pointsWon+=x;h.pointsLost+=as[i];a.pointsWon+=as[i];a.pointsLost+=x;});}const arr=Object.values(s).map(x=>({...x,setsDiff:x.setsWon-x.setsLost,pointsDiff:x.pointsWon-x.pointsLost}));return arr.sort((a,b)=>b.points-a.points||head2head(a.id,b.id)||b.setsDiff-a.setsDiff||b.pointsDiff-a.pointsDiff);}
function head2head(a,b){const m=state.matches.find(x=>x.played&&((x.homeId===a&&x.awayId===b)||(x.homeId===b&&x.awayId===a)));return !m?0:(m.winnerId===a?-1:1)}
function name(id){return state.teams.find(t=>t.id===id)?.name||'Equipo';}
function rounds(){return [...new Set(state.matches.map(m=>m.round))].sort((a,b)=>a-b)}
function makeSchedule(ts){let ids=ts.map(t=>t.id);if(ids.length<2)return[];if(ids.length%2)ids.push(null);let rot=[...ids],out=[],n=rot.length;for(let r=1;r<n;r++){for(let i=0;i<n/2;i++){const a=rot[i],b=rot[n-1-i];if(a&&b)out.push({round_number:r,week_label:`Jornada ${r}`,home_team_id:a,away_team_id:b,status:'scheduled'});}const last=rot.pop();rot.splice(1,0,last);}return out;}
function render(){document.querySelector('#nav').innerHTML=tabs.map(([id,label])=>`<button class="${state.tab===id?'active':''}" onclick="state.tab='${id}';render()">${label}</button>`).join('')+`<button style="margin-left:auto" onclick="openLogin()">${state.session?(state.isAdmin?'Directiva: salir':'Salir'):(state.captainSession?'Capitán: salir':'Acceso')}</button>`;const c=document.querySelector('#content');c.innerHTML=({standings:renderStandings,matrix:renderMatrix,schedule:renderSchedule,register:renderRegister,teams:renderTeams,rules:renderRules}[state.tab]||renderStandings)();}
function renderStandings(){const s=standings();return `<div class="card"><div class="row"><div><h2>Clasificación general</h2><p class="muted">Puntos › enfrentamiento directo › diferencia de sets › diferencia de puntos.</p></div><span class="pill">${s.length} equipos aprobados</span></div><div class="scroll"><table><thead><tr><th>Pos.</th><th>Equipo</th><th>Pts</th><th>PJ</th><th>PG</th><th>PP</th><th>Sets +/−</th><th>Puntos +/−</th></tr></thead><tbody>${s.map((t,i)=>`<tr><td>${i+1}</td><td><strong>${esc(t.name)}</strong><div class="muted small">${esc(t.player1)}, ${esc(t.player2)}, ${esc(t.player3)}</div></td><td><b>${t.points}</b></td><td>${t.played}</td><td>${t.won}</td><td>${t.lost}</td><td>${t.setsWon}/${t.setsLost}</td><td>${t.pointsWon}/${t.pointsLost}</td></tr>`).join('')||'<tr><td colspan="8">Aún no hay equipos aprobados.</td></tr>'}</tbody></table></div></div>`;}
function resultText(m){if(m.home_sets&&m.away_sets){const score=m.home_sets.map((x,i)=>`${x}-${m.away_sets[i]}`).join(', ');return m.status==='confirmed'?score:`${score} · ${m.status==='disputed'?'En revisión':'Por confirmar'}`;}return `J${m.round}`;}
function renderMatrix(){const ts=state.teams.filter(t=>t.approved);return `<div class="card"><h2>Cuadro de resultados</h2><p class="muted">Filas: equipo local · columnas: visitante. En móvil, desliza horizontalmente.</p><div class="matrix-scroll"><table class="matrix"><thead><tr><th>Local \\ Vis.</th>${ts.map((t,i)=>`<th title="${esc(t.name)}">E${i+1}</th>`).join('')}</tr></thead><tbody>${ts.map((a,i)=>`<tr><th title="${esc(a.name)}">E${i+1}</th>${ts.map(b=>{if(a.id===b.id)return '<td>—</td>';const m=state.matches.find(x=>x.homeId===a.id&&x.awayId===b.id);if(!m)return '<td>·</td>';return `<td><button class="${m.status==='confirmed'?(m.winnerId===a.id?'win':'loss'):(m.status==='scheduled'?'pending':'')}" title="${esc(a.name)} vs ${esc(b.name)}" onclick="showMatch('${m.id}')">${esc(resultText(m))}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`;}
function renderSchedule(){return `<div class="card"><div class="row"><div><h2>Calendario</h2><p class="muted">Una vuelta; el número de jornadas depende de los equipos aprobados.</p></div>${state.isAdmin?`<button class="btn primary" onclick="createSchedule()">Generar calendario</button>`:''}</div>${rounds().map(r=>`<h3>Jornada ${r}</h3><div class="grid">${state.matches.filter(m=>m.round===r).map(m=>`<div class="stat"><div class="row"><strong>${esc(name(m.homeId))} vs ${esc(name(m.awayId))}</strong><span class="pill ${m.status==='confirmed'?'ok':m.status==='disputed'?'bad':'wait'}">${m.status==='confirmed'?'Confirmado':m.status==='pending_confirmation'?'Por confirmar':m.status==='disputed'?'Discrepancia':'Pendiente'}</span></div><p>${esc(resultText(m))}</p>${m.dispute_note?`<p class="muted">Incidencia: ${esc(m.dispute_note)}</p>`:''}<div class="actions">${canReport(m)?`<button class="btn primary" onclick="showMatch('${m.id}')">Introducir resultado</button>`:''}${canConfirm(m)?`<button class="btn primary" onclick="showMatch('${m.id}')">Revisar resultado</button>`:''}</div></div>`).join('')}</div>`).join('')||'<p class="muted">El calendario aparecerá al aprobar los equipos y generarlo desde Directiva.</p>'}</div>`;}
function renderRegister(){return `<div class="card"><h2>Inscripción de equipo</h2><p class="muted">El primer integrante será el capitán. La inscripción quedará pendiente hasta que la directiva la apruebe. La confirmación aparece aquí en pantalla, sin SMS.</p><form onsubmit="registerTeam(event)"><label>Nombre del equipo<input required name="name" maxlength="60"></label><label>Nombre del capitán<input required name="captain" autocomplete="name"></label><label>Teléfono del capitán para el grupo de WhatsApp<input required name="phone" placeholder="+34 600 000 000" autocomplete="tel"></label><label>Compañero/a 2<input required name="p2"></label><label>Compañero/a 3<input required name="p3"></label><button class="btn primary" ${state.busy?'disabled':''}>Enviar inscripción</button></form></div>`;}
function renderTeams(){const pending=state.teams.filter(t=>t.status==='pending'),approved=state.teams.filter(t=>t.status==='approved');return `<div class="card"><div class="row"><div><h2>Equipos y directiva</h2><p class="muted">${approved.length} equipos aprobados. La lista pública no muestra teléfonos.</p></div>${state.isAdmin?`<div class="actions"><button class="btn" onclick="openSettings()">Ajustes de liga</button><button class="btn" onclick="exportData()">Exportar datos</button></div>`:''}</div>${state.isAdmin?`<h3>Inscripciones pendientes (${pending.length})</h3><div class="grid">${pending.map(t=>`<div class="stat"><strong>${esc(t.name)}</strong><p>${esc(t.player1)}, ${esc(t.player2)}, ${esc(t.player3)}</p><p>Capitán: ${esc(state.contacts[t.id]?.captain_name||'')} · ${esc(state.contacts[t.id]?.captain_phone||'')}</p><button class="btn primary" onclick="setTeam('${t.id}','approved')">Aprobar</button> <button class="btn" onclick="setTeam('${t.id}','rejected')">Rechazar</button></div>`).join('')||'<p class="muted">No hay inscripciones pendientes.</p>'}`:''}<h3>Equipos aprobados</h3><div class="grid">${approved.map((t,i)=>`<div class="stat"><strong>${i+1}. ${esc(t.name)}</strong><p class="muted">${esc(t.player1)} · ${esc(t.player2)} · ${esc(t.player3)}</p>${state.isAdmin?`<p class="small">Capitán: ${esc(state.contacts[t.id]?.captain_name||'')} · ${esc(state.contacts[t.id]?.captain_phone||'')}</p><button class="btn primary" onclick="prepareWhatsAppInvite('${t.id}')">Preparar invitación por WhatsApp</button>`:''}</div>`).join('')||'<p class="muted">Aún no hay equipos.</p>'}</div></div>`;}
function renderRules(){return `<div class="card"><h2>Reglamento oficial de la liga</h2><div class="grid"><div class="stat"><h3>Formato y puntuación</h3><ul><li>Partidos al mejor de 3 sets.</li><li>Sets 1 y 2 a 21 puntos, diferencia de 2; a 23-23, punto de oro 24-23.</li><li>Set 3 a 15 puntos, diferencia de 2; a 15-15, punto de oro 16-15.</li><li>Victoria 2-0: 3 puntos para el ganador. Victoria 2-1: 2 para el ganador y 1 para el perdedor.</li></ul></div><div class="stat"><h3>Inscripciones y participantes</h3><ul><li>El capitán registra el nombre del equipo, sus tres integrantes y un teléfono de contacto. Tras la aprobación, la directiva le prepara por WhatsApp el código de acceso y el enlace al grupo.</li><li>La inscripción no se incorpora a la competición hasta que la directiva la aprueba.</li><li>La liga acepta un número variable de equipos aprobados. La directiva genera el calendario de una vuelta cuando cierre las inscripciones.</li></ul></div><div class="stat"><h3>Resultados y confirmación</h3><ul><li>El capitán de cualquiera de los dos equipos introduce los tanteos de todos los sets disputados.</li><li>El capitán rival revisa el resultado y lo confirma; si no coincide, comunica la discrepancia.</li><li>Un resultado solo cuenta para la clasificación cuando queda confirmado. Las discrepancias las resuelve la directiva.</li><li>El teléfono solo lo ve la directiva. Tras aprobar el equipo, la directiva envía al capitán por WhatsApp un código privado de acceso y el enlace de invitación al grupo.</li></ul></div><div class="stat"><h3>Calendario, desempates y cena</h3><p>Un partido se podrá jugar en la semana anterior o posterior con acuerdo de ambos equipos y autorización de la directiva.</p><p>Desempates: enfrentamiento directo, diferencia de sets y diferencia de puntos.</p><p>La aportación de la cena se calcula con los tres primeros exentos y los tres últimos con la aportación mayor; se adapta a partir de 6 equipos.</p><p>La directiva resuelve las discrepancias e incidencias de la competición.</p></div></div>${state.isAdmin?`<hr><label>Coste total de la cena<input id="dinnerCost" type="number" value="${state.settings.dinner_cost}"></label><label>Precio por menú<input id="menuPrice" type="number" value="${state.settings.menu_price}"></label><button class="btn primary" onclick="saveSettings()">Guardar importes</button>`:''}<h3>Reparto actual de la cena</h3>${dinnerTable()}</div>`;}
function dinnerTable(){const s=standings(),n=s.length;if(n<6)return '<p class="muted">El reparto se activa cuando haya al menos 6 equipos aprobados.</p>';const total=Number(state.settings.dinner_cost)||0,menu=Number(state.settings.menu_price)||0,top=3,bottom=3,middle=n-6,covered=Math.min(total,menu*6),remaining=Math.max(0,total-covered),weights=Array.from({length:middle},(_,i)=>middle-i),sum=weights.reduce((a,b)=>a+b,0);return `<div class="scroll"><table><thead><tr><th>Pos.</th><th>Equipo</th><th>Aportación</th></tr></thead><tbody>${s.map((t,i)=>{let cost=0;if(i>=n-3)cost=covered/3+(middle===0?remaining/3:0);else if(i>=3)cost=remaining*(weights[i-3]||0)/(sum||1);return `<tr><td>${i+1}</td><td>${esc(t.name)}</td><td>${i<3?'Exento':cost.toFixed(2)+' €'}</td></tr>`}).join('')}</tbody></table></div>`;}
function openLogin(){if(state.session){db.auth.signOut();return;}if(state.captainSession){state.captainSession=null;state.captainTeamId=null;sessionStorage.removeItem('leagueCaptainSession');render();return;}document.querySelector('#modal').innerHTML=`<div class="modal"><div><div class="row"><h2>Acceso a la liga</h2><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="actions"><button class="btn ${state.loginMode==='admin'?'primary':''}" onclick="state.loginMode='admin';openLogin()">Directiva</button><button class="btn ${state.loginMode==='captain'?'primary':''}" onclick="state.loginMode='captain';openLogin()">Capitán</button></div>${state.loginMode==='admin'?`<form onsubmit="adminLogin(event)"><label>Correo<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" required></label><button class="btn primary">Entrar</button></form>`:`<p class="muted">Introduce el teléfono inscrito y el código que la directiva te envió por WhatsApp.</p><form onsubmit="captainLogin(event)"><label>Teléfono del capitán<input name="phone" placeholder="+34 600 000 000" required></label><label>Código de acceso<input name="code" autocomplete="one-time-code" required></label><button class="btn primary">Entrar como capitán</button></form>`}</div></div>`;}
function closeModal(){document.querySelector('#modal').innerHTML='';}
async function adminLogin(e){e.preventDefault();const f=new FormData(e.target);const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)toast(error.message);else{closeModal();toast('Sesión iniciada');}}
async function captainLogin(e){e.preventDefault();const f=new FormData(e.target),phone=String(f.get('phone')).replace(/[\s()-]/g,''),code=String(f.get('code')).trim();const {data,error}=await db.rpc('captain_team_for_access',{p_phone:phone,p_access_code:code});if(error||!data){toast(error?.message||'Teléfono o código incorrectos');return;}state.captainSession={phone,code};state.captainTeamId=data;sessionStorage.setItem('leagueCaptainSession',JSON.stringify(state.captainSession));closeModal();toast('Acceso de capitán activado');await load();}
async function registerTeam(e){e.preventDefault();const f=new FormData(e.target),phone=String(f.get('phone')).replace(/[\s()-]/g,'');const {error}=await db.rpc('register_team',{p_name:f.get('name'),p_player1:f.get('captain'),p_player2:f.get('p2'),p_player3:f.get('p3'),p_captain_name:f.get('captain'),p_captain_phone:phone});if(error){toast(error.message);return;}e.target.reset();toast('Inscripción recibida. La directiva debe aprobarla antes de entrar en el calendario.');await load();}
async function setTeam(id,status){const {error}=await db.rpc('set_team_status',{p_team_id:id,p_status:status});if(error){toast(error.message);return;}toast(status==='approved'?'Equipo aprobado':'Inscripción rechazada');await load();}
async function createSchedule(){if(!state.isAdmin)return;if(state.matches.length){toast('Ya existe un calendario. Para evitar duplicados, no se ha generado otro.');return;}const rows=makeSchedule(state.teams.filter(t=>t.approved));if(!rows.length){toast('Se necesitan al menos dos equipos aprobados.');return;}const {error}=await db.from('matches').insert(rows);if(error){toast(error.message);return;}toast(`Calendario creado: ${rows.length} partidos.`);await load();}
function canReport(m){return !!state.captainTeamId&&!state.isAdmin&&(state.captainTeamId===m.homeId||state.captainTeamId===m.awayId)&&['scheduled','disputed'].includes(m.status)}
function canConfirm(m){return !!state.captainTeamId&&!state.isAdmin&&m.status==='pending_confirmation'&&state.captainTeamId!==m.reported_by_team_id&&(state.captainTeamId===m.homeId||state.captainTeamId===m.awayId)}
function showMatch(id){const m=state.matches.find(x=>x.id===id);if(!m)return;const report=canReport(m),confirm=canConfirm(m);document.querySelector('#modal').innerHTML=`<div class="modal"><div><div class="row"><h2>${esc(name(m.homeId))} vs ${esc(name(m.awayId))}</h2><button class="btn" onclick="closeModal()">Cerrar</button></div><p class="muted">Jornada ${m.round}. Estado: ${esc(m.status)}</p>${m.status==='pending_confirmation'||m.status==='disputed'?`<p><strong>Resultado:</strong> ${esc(resultText(m))}</p>`:''}${m.dispute_note?`<p class="notice error">${esc(m.dispute_note)}</p>`:''}${state.isAdmin&&m.status==='disputed'?`<button class="btn primary" onclick="resolveDispute('${id}')">Resolver y confirmar este resultado</button>`:''}${state.isAdmin?`<label>Semana/fecha<input id="matchWeek" value="${esc(m.week_label||'')}"></label><label>Nota para el partido<textarea id="matchMemo">${esc(m.memo||'')}</textarea></label><button class="btn" onclick="saveMatchInfo('${id}')">Guardar nota y fecha</button>`:''}${report?`<div class="grid"><div><label>Sets equipo local (separados por coma)<input id="hs" placeholder="21, 18, 15"></label></div><div><label>Sets equipo visitante<input id="as" placeholder="16, 21, 12"></label></div></div><button class="btn primary" onclick="submitResult('${id}')">Enviar para confirmación</button>`:''}${confirm?`<div class="actions"><button class="btn primary" onclick="confirmResult('${id}')">Confirmar</button><input id="disputeReason" placeholder="Motivo si no coincide"><button class="btn" onclick="disputeResult('${id}')">Comunicar discrepancia</button></div>`:''}${!report&&!confirm?'<p class="muted">Accede como capitán de uno de los equipos de este partido para introducir o revisar el resultado.</p>':''}</div></div>`;}
function parseSets(id){const h=document.querySelector('#hs').value.split(',').map(x=>Number(x.trim())),a=document.querySelector('#as').value.split(',').map(x=>Number(x.trim()));if(h.length!==a.length||h.length<2||h.length>3||[...h,...a].some(x=>!Number.isInteger(x)||x<0)||h.some((x,i)=>x===a[i]))throw Error('Introduce 2 o 3 sets válidos en el mismo orden.');const valid=(x,y,target,cap)=>{const hi=Math.max(x,y),lo=Math.min(x,y);return (hi===target&&hi-lo>=2)||(hi===cap&&lo===cap-1)};if(!valid(h[0],a[0],21,24)||!valid(h[1],a[1],21,24))throw Error('Los dos primeros sets son a 21 puntos (diferencia de 2; máximo 24-23).');const firstWins=h.slice(0,2).filter((x,i)=>x>a[i]).length,secondWins=2-firstWins;if(h.length===2&&firstWins!==0&&secondWins!==0)throw Error('Si hay empate a sets, debes incluir el desempate.');if(h.length===3&&(firstWins!==1||secondWins!==1||!valid(h[2],a[2],15,16)))throw Error('El tercer set se juega solo con empate y es a 15 (máximo 16-15).');return[h,a];}
async function submitResult(id){try{const [h,a]=parseSets(id),{error}=await db.rpc('submit_match_result',{p_match_id:id,p_phone:state.captainSession.phone,p_access_code:state.captainSession.code,p_home_sets:h,p_away_sets:a});if(error)throw error;closeModal();toast('Resultado enviado al capitán rival');await load();}catch(e){toast(e.message)}}
async function confirmResult(id){const {error}=await db.rpc('confirm_match_result',{p_match_id:id,p_phone:state.captainSession.phone,p_access_code:state.captainSession.code});if(error){toast(error.message);return;}closeModal();toast('Resultado confirmado; ya cuenta en la clasificación.');await load();}
async function disputeResult(id){const reason=document.querySelector('#disputeReason').value;const {error}=await db.rpc('dispute_match_result',{p_match_id:id,p_phone:state.captainSession.phone,p_access_code:state.captainSession.code,p_reason:reason});if(error){toast(error.message);return;}closeModal();toast('Discrepancia comunicada a la directiva');await load();}
async function resolveDispute(id){const {error}=await db.from('matches').update({status:'confirmed',confirmed_by:state.session.user.id,dispute_note:null,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return;}closeModal();toast('La directiva ha resuelto la discrepancia');await load();}
async function saveMatchInfo(id){const {error}=await db.from('matches').update({week_label:document.querySelector('#matchWeek').value,memo:document.querySelector('#matchMemo').value,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return;}closeModal();toast('Datos del partido guardados');await load();}
function openSettings(){document.querySelector('#modal').innerHTML=`<div class="modal"><div><div class="row"><h2>Ajustes de liga</h2><button class="btn" onclick="closeModal()">Cerrar</button></div><label>Presidencia<input id="president" value="${esc(state.settings.president)}"></label><label>Secretaría<input id="secretary" value="${esc(state.settings.secretary)}"></label><label>Coste cena<input id="dinner" type="number" value="${state.settings.dinner_cost}"></label><label>Precio menú<input id="menu" type="number" value="${state.settings.menu_price}"></label><label>Enlace de invitación del grupo WhatsApp<input id="whatsappGroupLink" type="url" placeholder="https://chat.whatsapp.com/..." value="${esc(state.adminSettings.whatsapp_group_invite_url||'')}"></label><p class="muted small">Solo lo verá la directiva. Se incluirá en el mensaje privado preparado para cada capitán.</p><button class="btn primary" onclick="saveSettings()">Guardar</button></div></div>`;}
async function saveSettings(){const row={president:document.querySelector('#president')?.value??state.settings.president,secretary:document.querySelector('#secretary')?.value??state.settings.secretary,dinner_cost:Number(document.querySelector('#dinner')?.value??document.querySelector('#dinnerCost')?.value??state.settings.dinner_cost),menu_price:Number(document.querySelector('#menu')?.value??document.querySelector('#menuPrice')?.value??state.settings.menu_price),updated_at:new Date().toISOString()};const {error}=await db.from('league_settings').update(row).eq('singleton',true);if(error){toast(error.message);return;}if(document.querySelector('#whatsappGroupLink')){const {error:privateError}=await db.from('admin_settings').update({whatsapp_group_invite_url:document.querySelector('#whatsappGroupLink').value.trim(),updated_at:new Date().toISOString()}).eq('singleton',true);if(privateError){toast(privateError.message);return;}}closeModal();toast('Ajustes guardados');await load();}
async function prepareWhatsAppInvite(teamId){
  const team=state.teams.find(t=>t.id===teamId),contact=state.contacts[teamId],groupLink=state.adminSettings.whatsapp_group_invite_url;
  if(!team||!contact?.captain_phone){toast('No está disponible el teléfono del capitán');return;}
  if(!groupLink){toast('Guarda primero el enlace de invitación del grupo en Ajustes de liga');openSettings();return;}
  const {data:accessCode,error}=await db.rpc('issue_captain_access_code',{p_team_id:teamId});
  if(error){toast(error.message);return;}
  const appUrl=/^https?:/.test(location.href)?` Acceso a la web: ${location.href}`:'';
  const message=`Hola ${contact.captain_name}. El equipo ${team.name} ya está aprobado.

Código privado para acceder como capitán: ${accessCode}${appUrl}

Únete al grupo de WhatsApp de la liga: ${groupLink}

Guarda este código; con él podrás enviar resultados y confirmar los del equipo rival.`;
  const waPhone=contact.captain_phone.replace(/\D/g,'');
  document.querySelector('#modal').innerHTML=`<div class="modal"><div><div class="row"><h2>Invitación preparada</h2><button class="btn" onclick="closeModal()">Cerrar</button></div><p>Se ha creado un código nuevo. Si vuelves a preparar la invitación, el código anterior dejará de funcionar.</p><label>Código de acceso<textarea readonly rows="2">${esc(accessCode)}</textarea></label><p class="muted">El enlace lleva al chat privado con el capitán y prepara el texto. WhatsApp no añade a nadie ni envía el mensaje hasta que tú lo revises y pulses Enviar.</p><a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/${waPhone}?text=${encodeURIComponent(message)}">Abrir WhatsApp con la invitación</a></div></div>`;
}
function exportData(){if(!state.isAdmin)return;const payload={teams:state.teams,matches:state.matches,settings:state.settings,contacts:state.contacts,exported_at:new Date().toISOString()};const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(payload,null,2));a.download='liga_pickleball_backup.json';document.body.appendChild(a);a.click();a.remove();}
function renderScheduleTab(){return renderSchedule()}
if(db){render();load();try{db.channel('liga-live').on('postgres_changes',{event:'*',schema:'public',table:'teams'},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'matches'},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'league_settings'},()=>load()).subscribe();}catch(e){console.error('Actualización en vivo no disponible',e)}}
else{document.querySelector('#connection').textContent='Esta vista previa no ha podido cargar la conexión externa de la liga. Sube el archivo a GitHub Pages y abre la dirección HTTPS publicada para usar la aplicación.';document.querySelector('#connection').classList.add('error');document.querySelector('#nav').innerHTML='';document.querySelector('#content').innerHTML='<div class="card"><h2>Abre la liga publicada</h2><p>Este archivo se está mostrando como vista previa local. Para cargar los datos compartidos, primero publica <strong>index.html</strong> en GitHub Pages y entra desde su enlace HTTPS.</p></div>';}
</script></body></html>
