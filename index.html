<body>
<header><div class="head-copy"><p class="head-kicker">COMPETICIÓN AMATEUR</p><div class="head-title"><h1>Liga de Pickleball "Liceo de Noia"</h1></div><p id="subtitle">Deporte, competición y amistad</p></div></header>
<main class="wrap">
<div id="connection" class="notice warn">Conectando con la base de datos…</div>
<div class="bar" id="nav"></div>
<section id="content"></section>

</main><div id="toast" class="toast hidden"></div><div id="modal"></div>
<script>
const SUPABASE_URL='https://jfjevdkiinqhpsqkzter.supabase.co';
const SUPABASE_KEY='sb_publishable_dFlLBsrnDRRreoItpYsK7Q_2TrINEGg';
const db=window.supabase?.createClient?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let savedCaptainSession=null;try{savedCaptainSession=JSON.parse(sessionStorage.getItem('leagueCaptainSession')||'null')}catch{}
const MAX_TEAMS=16;
const state={tab:'standings',teams:[],contacts:{},matches:[],settings:{president:'Por determinar',administrator:'Por determinar',menu_price:30,organization_bizum_phone:''},adminSettings:{whatsapp_group_invite_url:''},session:null,isAdmin:false,captainSession:savedCaptainSession,captainTeamId:null,loginMode:'admin',busy:false};
const tabs=[['standings','Clasificación'],['matrix','Cuadro'],['schedule','Calendario'],['register','Inscribir equipo'],['teams','Equipos y Organización'],['rules','Normas y cena de confraternidad']];
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500)}
function setBusy(v){state.busy=v;render()}
function err(e){console.error(e);toast(e?.message||'No se pudo completar la acción')}
function normalizePhone(phone){let p=String(phone||'').replace(/[\s()-]/g,'');if(/^\d{9}$/.test(p))return '+34'+p;if(/^0034\d{9}$/.test(p))return '+34'+p.slice(4);return p;}
function mapTeam(t){return {...t,id:t.id,approved:t.status==='approved'};}
function mapMatch(m){let hs=m.home_sets||[],as=m.away_sets||[];const played=m.status==='confirmed';let hw=0,aw=0;hs.forEach((x,i)=>{if(x>as[i])hw++;else if(x<as[i])aw++});let hp=hw===2?(aw===0?3:2):(hw===1?1:0),ap=aw===2?(hw===0?3:2):(aw===1?1:0);return {...m,round:m.round_number,week:m.week_label,memo:m.memo||'',homeId:m.home_team_id,awayId:m.away_team_id,homeSet1:hs[0]??null,awaySet1:as[0]??null,homeSet2:hs[1]??null,awaySet2:as[1]??null,homeSet3:hs[2]??null,awaySet3:as[2]??null,played,winnerId:played?(hw===2?m.home_team_id:m.away_team_id):null,homePoints:played?hp:0,awayPoints:played?ap:0};}
let connectionWatchdog;async function load(){clearTimeout(connectionWatchdog);connectionWatchdog=setTimeout(()=>{const banner=document.querySelector('#connection');if(banner&&!banner.classList.contains('hidden')){banner.className='notice error';banner.textContent='Supabase no ha respondido en 15 segundos. Comprueba la conexión a internet y que el proyecto siga activo; recarga la página para intentarlo de nuevo.'}},15000);try{const [{data:teams,error:te},{data:matches,error:me},{data:settings}]=await Promise.all([db.from('teams').select('*').order('created_at'),db.from('matches').select('*').order('round_number'),db.from('league_settings').select('*').maybeSingle()]);if(te)throw te;if(me)throw me;state.teams=(teams||[]).map(mapTeam);state.matches=(matches||[]).map(mapMatch);if(settings)state.settings=settings;if(state.isAdmin){const [{data:contacts},{data:privateSettings}]=await Promise.all([db.from('team_contacts').select('team_id,captain_name,captain_phone'),db.from('admin_settings').select('*').maybeSingle()]);state.contacts=Object.fromEntries((contacts||[]).map(x=>[x.team_id,x]));if(privateSettings)state.adminSettings=privateSettings;}if(state.captainSession&&!state.isAdmin){const {data,error}=await db.rpc('captain_team_for_access',{p_phone:state.captainSession.phone,p_access_code:state.captainSession.code});state.captainTeamId=error?null:data;if(!state.captainTeamId){state.captainSession=null;sessionStorage.removeItem('leagueCaptainSession');}}clearTimeout(connectionWatchdog);document.querySelector('#connection').classList.add('hidden');}catch(e){clearTimeout(connectionWatchdog);document.querySelector('#connection').className='notice error';document.querySelector('#connection').textContent='No se pudo leer Supabase: '+(e.message||'Comprueba que ejecutaste el SQL de configuración.');console.error(e);}render();}
if(db)db.auth.onAuthStateChange((_event,session)=>{state.session=session;state.isAdmin=false;if(session){state.captainSession=null;state.captainTeamId=null;sessionStorage.removeItem('leagueCaptainSession');}setTimeout(async()=>{if(session){const {data,error}=await db.rpc('is_league_admin');state.isAdmin=!error&&data===true;}await load();},0);});
function standings(){const s=Object.fromEntries(state.teams.filter(t=>t.approved).map(t=>[t.id,{id:t.id,name:t.name,player1:t.player1,player2:t.player2,player3:t.player3,points:0,played:0,won:0,lost:0,setsWon:0,setsLost:0,pointsWon:0,pointsLost:0}]));for(const m of state.matches){if(!m.played||!s[m.homeId]||!s[m.awayId])continue;const h=s[m.homeId],a=s[m.awayId];h.played++;a.played++;h.points+=m.homePoints;a.points+=m.awayPoints;if(m.winnerId===m.homeId){h.won++;a.lost++}else{a.won++;h.lost++}const hs=[m.homeSet1,m.homeSet2,m.homeSet3],as=[m.awaySet1,m.awaySet2,m.awaySet3];hs.forEach((x,i)=>{if(x==null||as[i]==null)return;if(x>as[i]){h.setsWon++;a.setsLost++}else{a.setsWon++;h.setsLost++}h.pointsWon+=x;h.pointsLost+=as[i];a.pointsWon+=as[i];a.pointsLost+=x;});}const arr=Object.values(s).map(x=>({...x,setsDiff:x.setsWon-x.setsLost,pointsDiff:x.pointsWon-x.pointsLost}));return arr.sort((a,b)=>b.points-a.points||head2head(a.id,b.id)||b.setsDiff-a.setsDiff||b.pointsDiff-a.pointsDiff);}
function head2head(a,b){const m=state.matches.find(x=>x.played&&((x.homeId===a&&x.awayId===b)||(x.homeId===b&&x.awayId===a)));return !m?0:(m.winnerId===a?-1:1)}
function name(id){return state.teams.find(t=>t.id===id)?.name||displaySlots().find(t=>t.id===id)?.name||'Equipo';}
function rounds(){const active=new Set(state.teams.filter(t=>t.approved).map(t=>t.id));return [...new Set(state.matches.filter(m=>active.has(m.homeId)&&active.has(m.awayId)).map(m=>m.round))].sort((a,b)=>a-b)}
function scheduleKey(m){return `${m.round_number??m.round}|${m.home_team_id??m.homeId}|${m.away_team_id??m.awayId}`}
function makeSchedule(ts){let ids=ts.map(t=>t.id);if(ids.length<2)return[];if(ids.length%2)ids.push(null);let rot=[...ids],out=[],n=rot.length;for(let r=1;r<n;r++){for(let i=0;i<n/2;i++){const a=rot[i],b=rot[n-1-i];if(a&&b)out.push({round_number:r,week_label:'',home_team_id:a,away_team_id:b,status:'scheduled'});}const last=rot.pop();rot.splice(1,0,last);}return out;}
function render(){document.querySelector('#nav').innerHTML=tabs.map(([id,label])=>`<button class="${state.tab===id?'active':''}" onclick="state.tab='${id}';render()">${label}</button>`).join('')+`<button style="margin-left:auto" onclick="openLogin()">${state.session?(state.isAdmin?'Organización: salir':'Salir'):(state.captainSession?'Capitán: salir':'Acceso')}</button>`;const c=document.querySelector('#content');c.innerHTML=({standings:renderStandings,matrix:renderMatrix,schedule:renderSchedule,register:renderRegister,teams:renderTeams,rules:renderRules}[state.tab]||renderStandings)();}
function displaySlots(){const approved=state.teams.filter(t=>t.approved);return Array.from({length:MAX_TEAMS},(_,i)=>approved[i]||({id:'slot-'+(i+1),name:'E'+(i+1),player1:'P'+(i+1)+'1',player2:'P'+(i+1)+'2',player3:'P'+(i+1)+'3',approved:true,isPlaceholder:true}));}
function renderStandings(){const actual=standings(),placeholders=displaySlots().filter(t=>t.isPlaceholder).map(t=>({...t,points:0,played:0,won:0,lost:0,setsWon:0,setsLost:0,pointsWon:0,pointsLost:0})),s=[...actual,...placeholders],realCount=state.teams.filter(t=>t.approved).length;return `<div class="card"><div class="row"><div><h2>Clasificación general</h2><p class="muted">Puntos › enfrentamiento directo › diferencia de sets › diferencia de puntos.</p></div><span class="pill">${realCount}/16 equipos aprobados</span></div>${placeholders.length?'<p class="notice">E1–E16 y P11–P13, P21–P23… son plazas de muestra; cada una se sustituye con los datos reales al aprobar la inscripción.</p>':''}<div class="scroll"><table><thead><tr><th>Pos.</th><th>Equipo / jugadores</th><th>Pts</th><th>PJ</th><th>PG</th><th>PP</th><th>Sets +/−</th><th>Puntos +/−</th></tr></thead><tbody>${s.map((t,i)=>`<tr><td>${i+1}</td><td><strong>${esc(t.name)}</strong>${t.isPlaceholder?'<span class="pill wait small">Plaza de muestra</span>':''}<div class="muted small">${esc(t.player1)}, ${esc(t.player2)}, ${esc(t.player3)}</div></td><td><b>${t.points}</b></td><td>${t.played}</td><td>${t.won}</td><td>${t.lost}</td><td>${t.setsWon}/${t.setsLost}</td><td>${t.pointsWon}/${t.pointsLost}</td></tr>`).join('')}</tbody></table></div></div>`;}
function matchStatusText(status){return ({scheduled:'Pendiente de jugar',pending_confirmation:'Pendiente de confirmación',confirmed:'Confirmado',disputed:'En discrepancia'})[status]||status;}
function resultText(m){if(m.home_sets&&m.away_sets){const score=m.home_sets.map((x,i)=>`${x}-${m.away_sets[i]}`).join(', ');return m.status==='confirmed'?score:`${score} · ${m.status==='disputed'?'En revisión':'Por confirmar'}`;}return `J${m.round}`;}
function shortTeamName(name){const clean=String(name||'').trim();return clean.length>10?clean.slice(0,9)+'…':clean;}
function renderMatrix(){const ts=displaySlots();return `<div class="card"><h2>Cuadro de resultados · 16 equipos</h2><p class="muted">Filas: local · columnas: visitante. E1–E16 son plazas de muestra que se sustituyen con equipos aprobados. Los nombres abreviados muestran el nombre completo al pasar el cursor. En móvil, desliza horizontalmente.</p><div class="matrix-scroll"><table class="matrix"><thead><tr><th>Local \ Vis.</th>${ts.map(t=>`<th title="${esc(t.name)}"><span class="matrix-name">${esc(shortTeamName(t.name))}</span></th>`).join('')}</tr></thead><tbody>${ts.map(a=>`<tr><th title="${esc(a.name)} · ${esc(a.player1)}, ${esc(a.player2)}, ${esc(a.player3)}"><span class="matrix-name">${esc(shortTeamName(a.name))}</span></th>${ts.map(b=>{if(a.id===b.id)return '<td>—</td>';const m=state.matches.find(x=>x.homeId===a.id&&x.awayId===b.id);if(!m)return '<td title="Partido aún no generado">·</td>';return `<td><button class="${m.status==='confirmed'?(m.winnerId===a.id?'win':'loss'):(m.status==='scheduled'?'pending':'')}" title="${esc(a.name)} vs ${esc(b.name)}" onclick="showMatch('${m.id}')">${esc(resultText(m))}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`;}
function renderSchedule(){const approved=state.teams.filter(t=>t.approved),approvedCount=approved.length,ready=approvedCount===MAX_TEAMS,expected=ready?makeSchedule(approved):[],existingKeys=new Set(state.matches.map(scheduleKey)),missingRows=expected.filter(m=>!existingKeys.has(scheduleKey(m))),isComplete=ready&&missingRows.length===0,isPreview=state.matches.length===0,slots=displaySlots(),previewMatches=isPreview?makeSchedule(slots).map(m=>({...m,round:m.round_number,homeId:m.home_team_id,awayId:m.away_team_id})):[],source=isPreview?previewMatches:state.matches,viewRounds=isPreview?[...new Set(previewMatches.map(m=>m.round))]:rounds();return `<div class="card"><div class="row"><div><h2>Calendario · 16 equipos</h2><p class="muted">Con los 16 equipos aprobados, el calendario completo tiene 15 jornadas y 120 partidos.</p></div>${state.isAdmin?`<button class="btn primary" onclick="createSchedule()" ${!ready||isComplete?'disabled':''}>${isComplete?'Calendario generado':ready?(state.matches.length?'Completar calendario · '+missingRows.length+' partidos':'Generar calendario'):'Faltan '+(MAX_TEAMS-approvedCount)+' equipos aprobados'}</button>`:''}</div>${isPreview?'<p class="notice">Vista de muestra: E1–E16 y P11–P13, P21–P23… representan plazas vacantes. No se guardan como equipos ni permiten enviar resultados.</p>':!isComplete&&ready?`<p class="notice warn">El calendario está incompleto: ${expected.length-missingRows.length} de 120 partidos creados. Pulsa «Completar calendario»; se conservarán los partidos y resultados que ya existan.</p>`:'<p class="notice">“Pendiente de jugar” significa que aún no se ha disputado el partido o enviado su resultado. Después, el equipo rival tendrá que confirmarlo.</p>'}${viewRounds.map(r=>{const roundMatches=source.filter(m=>m.round===r&&(isPreview||(state.teams.some(t=>t.id===m.homeId&&t.approved)&&state.teams.some(t=>t.id===m.awayId&&t.approved))));const savedWeek=roundMatches.map(m=>m.week_label).find(w=>w&&w!==`Jornada ${r}`)||'';return `<section><h3>Jornada ${r} · ${esc(savedWeek||'Semana por asignar')}</h3>${state.isAdmin&&!isPreview?`<div class="row" style="margin:8px 0 12px"><label style="flex:1;min-width:230px;margin:0">Semana de esta jornada<input id="weekRound-${r}" type="text" placeholder="Ej.: Semana del 3 al 9 de mayo" value="${esc(savedWeek)}"></label><button class="btn" onclick="setRoundWeek(${r})">Guardar semana para la jornada</button></div>`:isPreview?'<p class="muted small">La semana se asigna cuando se genere el calendario oficial.</p>':`<p class="muted small">Semana asignada: ${esc(savedWeek||'Pendiente de asignación')}</p>`}<div class="grid">${roundMatches.map(m=>`<div class="stat"><div class="row"><strong>${esc(name(m.homeId))} vs ${esc(name(m.awayId))}</strong><span class="pill ${m.status==='confirmed'?'ok':m.status==='disputed'?'bad':'wait'}">${m.status==='confirmed'?'Confirmado':m.status==='pending_confirmation'?'Pendiente de confirmación':m.status==='disputed'?'En discrepancia':'Pendiente de jugar'}</span></div><p>${esc(resultText(m))}</p>${m.dispute_note?`<p class="muted">Incidencia: ${esc(m.dispute_note)}</p>`:''}<div class="actions">${!isPreview&&canReport(m)?`<button class="btn primary" onclick="showMatch('${m.id}')">Introducir resultado</button>`:''}${!isPreview&&canConfirm(m)?`<button class="btn primary" onclick="showMatch('${m.id}')">Revisar resultado</button>`:''}</div></div>`).join('')}</div></section>`}).join('')}</div>`;}

function renderTeams(){const pending=state.teams.filter(t=>t.status==='pending'),approved=state.teams.filter(t=>t.status==='approved'),withdrawn=state.teams.filter(t=>t.status==='rejected');return `<div class="card"><div class="row"><div><h2>Equipos y Organización</h2><p class="muted">${approved.length}/16 equipos aprobados. La lista pública no muestra teléfonos.</p><p class="small">Presidente: ${esc(state.settings.president||'Por determinar')} · Administrador: ${esc(state.settings.administrator||'Por determinar')}</p></div>${state.isAdmin?`<div class="actions"><button class="btn" onclick="openSettings()">Ajustes de liga</button><button class="btn" onclick="exportData()">Exportar datos</button></div>`:''}</div>${state.isAdmin?`<h3>Inscripciones pendientes de aprobación (${pending.length})</h3><div class="grid">${pending.map(t=>`<div class="stat"><strong>${esc(t.name)}</strong><p>${esc(t.player1)}, ${esc(t.player2)}, ${esc(t.player3)}</p><p>Capitán: ${esc(state.contacts[t.id]?.captain_name||'')} · ${esc(state.contacts[t.id]?.captain_phone||'')}</p><button class="btn primary" onclick="setTeam('${t.id}','approved')">Aprobar</button> <button class="btn" onclick="setTeam('${t.id}','rejected')">Rechazar inscripción</button></div>`).join('')||'<p class="muted">No hay inscripciones pendientes.</p>'}`:''}<h3>Equipos aprobados</h3><div class="grid">${approved.map((t,i)=>`<div class="stat"><strong>${i+1}. ${esc(t.name)}</strong><p class="muted">${esc(t.player1)} · ${esc(t.player2)} · ${esc(t.player3)}</p>${state.isAdmin?`<p class="small">Capitán: ${esc(state.contacts[t.id]?.captain_name||'')} · ${esc(state.contacts[t.id]?.captain_phone||'')}</p><div class="actions"><button class="btn primary" onclick="prepareWhatsAppInvite('${t.id}')">Preparar invitación por WhatsApp</button><button class="btn" onclick="setTeam('${t.id}','rejected')">Dar de baja equipo</button></div>`:''}</div>`).join('')||'<p class="muted">Aún no hay equipos.</p>'}</div>${state.isAdmin&&withdrawn.length?`<h3>Equipos dados de baja (${withdrawn.length})</h3><div class="grid">${withdrawn.map(t=>`<div class="stat"><strong>${esc(t.name)}</strong><p class="muted">${esc(t.player1)} · ${esc(t.player2)} · ${esc(t.player3)}</p><button class="btn" onclick="setTeam('${t.id}','approved')">Reactivar equipo</button></div>`).join('')}</div>`:''}</div>`;}
function renderRules(){const bizum=state.settings.organization_bizum_phone?esc(state.settings.organization_bizum_phone):'por indicar por la Organización';return `<div class="card"><h2>Normas de la liga</h2><div class="grid rules-grid"><div class="stat"><h3>Formato y puntuación</h3><ul><li>La competición está integrada por 16 equipos.</li><li>Los partidos se juegan al mejor de 3 sets.</li><li>El 1º y 2º sets se juegan a 21 puntos (diferencia de 2), con punto de oro a 23.</li><li>El tercer set de desempate se juega a 15 puntos (diferencia de 2), con punto de oro a 15-15.</li><li> EL equipo que gane por 2 sets a 0 se lleva 3 puntos; el que pierda se lleva 0 puntos. El equipo que gane por 2 sets a 1 se lleva 2 puntos; el perdedor se lleva 1 punto.</li></ul></div><div class="stat"><h3>Inscripción, pagos y WhatsApp</h3><ul><li>El capitán inscribe a los tres integrantes e indica su teléfono de contacto.</li><li>La inscripción es provisional hasta la revisión y aprobación por parte de la Organización.</li><li>Para ello, el capitán debe envíar 15 € mediante Bizum al teléfono de la Organización (${bizum}), como aportación de gastos de gestión para el buen desarrollo de la competición.</li><li>Tras ello, el Administrador envíará al capitán por WhatsApp la invitación al grupo oficial del torneo y el código personal de acceso a la aplicación web para introducir o confirmar los resultados de los partidos jugados.</li></ul></div><div class="stat"><h3>Partidos y resultados</h3><ul><li>Los capitanes de ambos equipos deben acordar el campo de juego, el día de la semana y el horario concreto en el chat oficial de WhatsApp, manteniendo así informados a todos los participantes.</li><li>El capitán de cualquiera de los dos equipos introducirá los tanteos de todos los sets disputados y el capitán rival revisará el resultado y lo confirmará, si procede. En caso contrario, debe comunicar la discrepancia a través del chat oficial.</li><li>La Organización resolverá todas las disputas o dudas que puedan surgir de manera inapelable.</li></ul></div><div class="stat"><h3>Cena de confraternidad</h3><ul><li>Al finalizar la competición se celebrará una cena de confraternidad a la que pueden y deben asistir todos los participantes.</li><li>Los nueve jugadores de los tres primeros equipos quedan exentos; sus menús los pagan los nueve jugadores de los tres últimos.</li><li>Los diez equipos intermedios aportan en conjunto el 62,5 % del coste total. El equipo clasificado en 4.º puesto paga menos y la aportación aumenta progresivamente hasta el 13.º puesto. La tabla muestra el peso, el porcentaje, el importe por equipo y el promedio por participante.</li><li>Para los posibles empates a puntos se tendrá en cuenta: (1) el resultado del enfrentamiento directo; (2) la diferencia global de sets a favor y en contra; (3) la diferencia de puntos; y (4) un sorteo.</li></ul></div></div>${state.isAdmin?`<hr><label>Presidente<input id="president" value="${esc(state.settings.president||'')}"></label><label>Administrador<input id="administrator" value="${esc(state.settings.administrator||'')}"></label><label>Precio por menú<input id="menuPrice" type="number" min="0" step="0.01" value="${state.settings.menu_price}"></label><label>Teléfono Bizum de la Organización<input id="bizumPhone" type="tel" placeholder="Teléfono para recibir la cuota de 15€ de inscripción por equipo" value="${esc(state.settings.organization_bizum_phone||'')}"></label><button class="btn primary" onclick="saveSettings()">Guardar importes y datos</button>`:''}<h3>Reparto aproximado de la cena de confraternidad</h3>${dinnerTable()}</div>`;}
function dinnerTable(){
  const s=standings(),n=s.length,menu=Number(state.settings.menu_price)||0,participants=n*3,total=menu*participants;
  if(!n)return '<p class="muted">El cálculo aproximado aparecerá cuando haya equipos aprobados.</p>';
  const summary=`<p class="muted">Coste total aproximado de la cena: ${total.toFixed(2)} € (${participants} participantes × ${menu.toFixed(2)} € por menú).</p>`;
  if(n<6)return summary+'<p class="muted">El reparto por equipos se muestra a partir de 6 equipos aprobados.</p>';
  const middle=n-6;
  let middleBudget,bottomBudget;
  if(n===16){middleBudget=Math.round(total*0.625*100)/100;bottomBudget=total-middleBudget;}
  else if(middle===0){middleBudget=0;bottomBudget=total;}
  else{bottomBudget=Math.min(total,menu*6);middleBudget=total-bottomBudget;}
  const middlePositions=Array.from({length:middle},(_,i)=>i+4),weights=middlePositions,weightSum=weights.reduce((a,b)=>a+b,0);
  const middleCosts=[],middlePercents=[];let allocatedCost=0;
  weights.forEach((weight,i)=>{
    const cost=i===weights.length-1?Math.round((middleBudget-allocatedCost)*100)/100:Math.round((middleBudget*weight/weightSum)*100)/100;
    const percent=(n===16?62.5:middleBudget/total*100)*weight/weightSum;
    middleCosts.push(cost);middlePercents.push(percent);allocatedCost+=cost;
  });
  const bottomCosts=[],bottomPercents=[];let bottomCostAssigned=0;
  for(let j=0;j<3;j++){
    const cost=j===2?Math.round((bottomBudget-bottomCostAssigned)*100)/100:Math.round((bottomBudget/3)*100)/100;
    bottomCosts.push(cost);bottomPercents.push(n===16?12.5:(bottomBudget/total*100)/3);bottomCostAssigned+=cost;
  }
  const rows=s.map((t,i)=>{
    const position=i+1;let cost=0,percent=0,positionWeight='—';
    if(position>=n-2){const j=position-(n-2);cost=bottomCosts[j]||0;percent=bottomPercents[j]||0;}
    else if(position>=4){const j=position-4;cost=middleCosts[j]||0;percent=middlePercents[j]||0;positionWeight=String(position);}
    const perPlayer=cost/3;
    return `<tr><td>${position}</td><td>${esc(t.name)}</td><td>${positionWeight}</td><td>${percent.toFixed(4).replace('.',',')}%</td><td>${position<=3?'0,00 €':`~${cost.toFixed(2)} €`}</td><td>${position<=3?'0,00 €':`~${perPlayer.toFixed(2)} €`}</td></tr>`;
  }).join('');
  const middleTotal=n===16?'62,5000':(middleBudget/total*100).toFixed(4).replace('.',',');
  return summary+`<p class="muted">Los tres primeros equipos (nueve participantes) quedan exentos. Los nueve jugadores de los tres últimos pagan también esos nueve menús: cada equipo último aporta el 12,5 % de la cena y cada uno de sus jugadores abona un tercio. Los equipos intermedios (puestos 4.º a 13.º) aportan conjuntamente el 62,5 %. Se usan como pesos los puestos 4, 5, 6, 7, 8, 9, 10, 11, 12 y 13. Así, el equipo clasificado en 4.º puesto paga menos y la aportación aumenta progresivamente hasta el 13.º puesto; los importes se normalizan para que sumen el 62,5 % del coste total.</p><div class="scroll"><table><thead><tr><th>Pos.</th><th>Equipo</th><th>Peso de reparto</th><th>Porcentaje de la cena</th><th>Aportación del equipo</th><th>Por participante (3)</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="2">Total equipos intermedios</th><th>Σ ${weightSum.toFixed(4).replace('.',',')}</th><th>${middleTotal}%</th><th>~${middleBudget.toFixed(2)} €</th><th>~${(middle?middleBudget/(middle*3):0).toFixed(2)} € media por participante*</th></tr></tfoot></table></div><p class="small muted">*Promedio aproximado por participante; el importe de cada equipo se reparte entre sus tres jugadores.</p>`;
}

async function saveSettings(){
  if(!state.isAdmin||!db)return;
  const btn=document.querySelector('#saveLeagueSettings');if(btn){btn.disabled=true;btn.textContent='Guardando…';}
  try{
    const field=id=>document.querySelector(id);
    const groupLink=(field('#settingsWhatsappLink')?.value??state.adminSettings.whatsapp_group_invite_url??'').trim();
    if(groupLink&&!/^https:\/\/chat\.whatsapp\.com\/[A-Za-z0-9_-]+\/?$/.test(groupLink))throw new Error('El enlace debe tener el formato https://chat.whatsapp.com/…');
    const menu=Number((field('#settingsMenuPrice')||field('#menuPrice'))?.value);
    if(!Number.isFinite(menu)||menu<0)throw new Error('Indica un precio por menú válido.');
    const setting={singleton:true,president:(field('#settingsPresident')||field('#president')).value.trim()||'Por determinar',administrator:(field('#settingsAdministrator')||field('#administrator')).value.trim()||'Por determinar',menu_price:menu,organization_bizum_phone:(field('#settingsBizumPhone')||field('#bizumPhone')).value.trim(),updated_at:new Date().toISOString()};
    const {error:leagueError}=await db.from('league_settings').update(setting).eq('singleton',true);if(leagueError)throw leagueError;
    const {error:linkError}=await db.from('admin_settings').upsert({singleton:true,whatsapp_group_invite_url:groupLink,updated_at:new Date().toISOString()},{onConflict:'singleton'});if(linkError)throw linkError;
    state.settings={...state.settings,...setting};state.adminSettings={...state.adminSettings,whatsapp_group_invite_url:groupLink};closeModal();toast('Ajustes de liga guardados');await load();
  }catch(err){const raw=err.message||'No se pudieron guardar los ajustes';const msg=/administrator|organization_bizum_phone|menu_price|schema cache|column/i.test(raw)?'Supabase no reconoce una columna de ajustes (Administrador, Bizum o precio del menú). En el paquete actualizado ejecuta el archivo supabase_reparar_ajustes.sql en SQL Editor, espera unos segundos y vuelve a cargar la página. Detalle: '+raw:raw;toast(msg);if(btn){btn.disabled=false;btn.textContent='Guardar ajustes';}}
}

async function captainLogin(e){e.preventDefault();const f=new FormData(e.target),phone=normalizePhone(f.get('phone')),code=String(f.get('code')).trim();const {data,error}=await db.rpc('captain_team_for_access',{p_phone:phone,p_access_code:code});if(error||!data){toast(error?.message||'Teléfono o código incorrectos');return;}state.captainSession={phone,code};state.captainTeamId=data;sessionStorage.setItem('leagueCaptainSession',JSON.stringify(state.captainSession));closeModal();toast('Acceso de capitán activado');await load();}

async function setTeam(id,status){const current=state.teams.find(t=>t.id===id);if(status==='rejected'&&!confirm(current?.status==='approved'?'¿Dar de baja este equipo? Dejará de aparecer en la clasificación.':'¿Rechazar esta inscripción?'))return;const {error}=await db.rpc('set_team_status',{p_team_id:id,p_status:status});if(error){toast(error.message);return;}toast(status==='approved'?'Equipo aprobado':status==='rejected'?'Equipo dado de baja':'Inscripción rechazada');await load();}

async function createSchedule(){if(!state.isAdmin)return;const approved=state.teams.filter(t=>t.approved);if(approved.length!==MAX_TEAMS){toast(`Hay ${approved.length} de 16 equipos aprobados; el calendario requiere los 16.`);return;}const rows=makeSchedule(approved);if(rows.length!==120){toast('No se pudo crear el calendario completo de 16 equipos.');return;}const existingKeys=new Set(state.matches.map(scheduleKey)),missing=rows.filter(m=>!existingKeys.has(scheduleKey(m)));if(!missing.length){toast('El calendario ya contiene los 120 partidos.');await load();return;}const {error}=await db.from('matches').insert(missing);if(error){toast('No se pudieron guardar los partidos que faltan: '+error.message);return;}toast(`Calendario completado: se añadieron ${missing.length} partidos y se conservaron los ya existentes.`);await load();}
function canReport(m){return !!state.captainTeamId&&!state.isAdmin&&(state.captainTeamId===m.homeId||state.captainTeamId===m.awayId)&&['scheduled','disputed'].includes(m.status)}
function canConfirm(m){return !!state.captainTeamId&&!state.isAdmin&&m.status==='pending_confirmation'&&state.captainTeamId!==m.reported_by_team_id&&(state.captainTeamId===m.homeId||state.captainTeamId===m.awayId)}
function showMatch(id){const m=state.matches.find(x=>x.id===id);if(!m)return;const report=canReport(m),confirm=canConfirm(m);document.querySelector('#modal').innerHTML=`<div class="modal"><div><div class="row"><h2>${esc(name(m.homeId))} vs ${esc(name(m.awayId))}</h2><button class="btn" onclick="closeModal()">Cerrar</button></div><p class="muted">Jornada ${m.round}. Estado: ${esc(matchStatusText(m.status))}</p>${m.status==='pending_confirmation'||m.status==='disputed'?`<p><strong>Resultado:</strong> ${esc(resultText(m))}</p>`:''}${m.dispute_note?`<p class="notice error">${esc(m.dispute_note)}</p>`:''}${state.isAdmin&&m.status==='disputed'?`<button class="btn primary" onclick="resolveDispute('${id}')">Resolver y confirmar este resultado</button>`:''}${state.isAdmin?`<label>Nota del partido<textarea id="matchMemo">${esc(m.memo||'')}</textarea></label><button class="btn" onclick="saveMatchInfo('${id}')">Guardar nota</button>`:''}${report?`<div class="grid"><div><label>Sets equipo local (separados por coma)<input id="hs" placeholder="21, 18, 15"></label></div><div><label>Sets equipo visitante<input id="as" placeholder="16, 21, 12"></label></div></div><button class="btn primary" onclick="submitResult('${id}')">Enviar para confirmación</button>`:''}${confirm?`<div class="actions"><button class="btn primary" onclick="confirmResult('${id}')">Confirmar</button><input id="disputeReason" placeholder="Motivo si no coincide"><button class="btn" onclick="disputeResult('${id}')">Comunicar discrepancia</button></div>`:''}${!report&&!confirm?'<p class="muted">Accede como capitán de uno de los equipos de este partido para introducir o revisar el resultado.</p>':''}</div></div>`;}
function parseSets(id){const h=document.querySelector('#hs').value.split(',').map(x=>Number(x.trim())),a=document.querySelector('#as').value.split(',').map(x=>Number(x.trim()));if(h.length!==a.length||h.length<2||h.length>3||[...h,...a].some(x=>!Number.isInteger(x)||x<0)||h.some((x,i)=>x===a[i]))throw Error('Introduce 2 o 3 sets válidos en el mismo orden.');const valid=(x,y,target,cap)=>{const hi=Math.max(x,y),lo=Math.min(x,y);return (hi===target&&hi-lo>=2)||(hi===cap&&lo===cap-1)};if(!valid(h[0],a[0],21,24)||!valid(h[1],a[1],21,24))throw Error('Los dos primeros sets son a 21 puntos (diferencia de 2; máximo 24-23).');const firstWins=h.slice(0,2).filter((x,i)=>x>a[i]).length,secondWins=2-firstWins;if(h.length===2&&firstWins!==0&&secondWins!==0)throw Error('Si hay empate a sets, debes incluir el desempate.');if(h.length===3&&(firstWins!==1||secondWins!==1||!valid(h[2],a[2],15,16)))throw Error('El tercer set se juega solo con empate y es a 15 (máximo 16-15).');return[h,a];}
async function submitResult(id){try{const [h,a]=parseSets(id),{error}=await db.rpc('submit_match_result',{p_match_id:id,p_phone:state.captainSession.phone,p_access_code:state.captainSession.code,p_home_sets:h,p_away_sets:a});if(error)throw error;closeModal();toast('Resultado enviado al capitán rival');await load();}catch(e){toast(e.message)}}
async function confirmResult(id){const {error}=await db.rpc('confirm_match_result',{p_match_id:id,p_phone:state.captainSession.phone,p_access_code:state.captainSession.code});if(error){toast(error.message);return;}closeModal();toast('Resultado confirmado; ya cuenta en la clasificación.');await load();}
async function disputeResult(id){const reason=document.querySelector('#disputeReason').value;const {error}=await db.rpc('dispute_match_result',{p_match_id:id,p_phone:state.captainSession.phone,p_access_code:state.captainSession.code,p_reason:reason});if(error){toast(error.message);return;}closeModal();toast('Discrepancia comunicada a la Organización');await load();}
async function resolveDispute(id){const {error}=await db.from('matches').update({status:'confirmed',confirmed_by:state.session.user.id,dispute_note:null,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return;}closeModal();toast('La Organización ha resuelto la discrepancia');await load();}
async function saveMatchInfo(id){const {error}=await db.from('matches').update({memo:document.querySelector('#matchMemo').value,updated_at:new Date().toISOString()}).eq('id',id);if(error){toast(error.message);return;}closeModal();toast('Nota guardada');await load();}
async function prepareWhatsAppInvite(teamId){
  const team=state.teams.find(t=>t.id===teamId),contact=state.contacts[teamId],groupLink=state.adminSettings.whatsapp_group_invite_url;
  if(!team||!contact?.captain_phone){toast('No está disponible el teléfono del capitán');return;}
  if(!groupLink){toast('Guarda primero el enlace de invitación del grupo en Ajustes de liga');openSettings();return;}
  const {data:accessCode,error}=await db.rpc('issue_captain_access_code',{p_team_id:teamId});
  if(error){toast(error.message);return;}
  const appUrl=/^https?:/.test(location.href)?` Acceso a la web: ${location.href}`:'';
  const message=`Hola ${contact.captain_name}. El equipo ${team.name} ya está aprobado.

Código privado para acceder como capitán: ${accessCode}${appUrl}

Únete al grupo de WhatsApp de la liga: ${groupLink}

Guarda este código; con él podrás enviar resultados y confirmar los del equipo rival.`;
  const waPhone=contact.captain_phone.replace(/\D/g,'');
  document.querySelector('#modal').innerHTML=`<div class="modal"><div><div class="row"><h2>Invitación preparada</h2><button class="btn" onclick="closeModal()">Cerrar</button></div><p>Se ha creado un código nuevo. Si vuelves a preparar la invitación, el código anterior dejará de funcionar.</p><label>Código de acceso<textarea readonly rows="2">${esc(accessCode)}</textarea></label><p class="muted">El enlace lleva al chat privado con el capitán y prepara el texto. WhatsApp no añade a nadie ni envía el mensaje hasta que tú lo revises y pulses Enviar.</p><a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/${waPhone}?text=${encodeURIComponent(message)}">Abrir WhatsApp con la invitación</a></div></div>`;
}
function exportData(){if(!state.isAdmin)return;const payload={teams:state.teams,matches:state.matches,settings:state.settings,contacts:state.contacts,exported_at:new Date().toISOString()};const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(payload,null,2));a.download='liga_pickleball_backup.json';document.body.appendChild(a);a.click();a.remove();}
function renderScheduleTab(){return renderSchedule()}
if(db){render();load();try{db.channel('liga-live').on('postgres_changes',{event:'*',schema:'public',table:'teams'},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'matches'},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'league_settings'},()=>load()).subscribe();}catch(e){console.error('Actualización en vivo no disponible',e)}}
else{document.querySelector('#connection').textContent='Esta vista previa no ha podido cargar la conexión externa de la liga. Sube el archivo a GitHub Pages y abre la dirección HTTPS publicada para usar la aplicación.';document.querySelector('#connection').classList.add('error');document.querySelector('#nav').innerHTML='';document.querySelector('#content').innerHTML='<div class="card"><h2>Abre la liga publicada</h2><p>Este archivo se está mostrando como vista previa local. Para cargar los datos compartidos, primero publica <strong>index.html</strong> en GitHub Pages y entra desde su enlace HTTPS.</p></div>';}
</script></body></html>
